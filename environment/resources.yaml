name: academic-polish-faithful
version: 1.3.0
entrypoint: ../SKILL.md
bundle_root: ..
description: >
  学术语言润色 Skill 的资源清单。执行内核为 resources/scripts/edit_lint.py，
  负责把原稿与改稿做句级对齐，检出限定强度漂移、强度词丢失、数字单位引用被改、
  整句增删、术语写法漂移、语域与硬错误，以及"改了却没写进修改清单"。

resources:
  - path: resources/scripts/edit_lint.py
    kind: executable
    runtime: python3
    entry: "python3 resources/scripts/edit_lint.py"
    subcommands: [split, terms, lint, report]
    requires: []          # 纯标准库，无第三方依赖，可完全离线
    inputs:
      - "原稿纯文本（.txt/.md/.tex 片段；UTF-8）"
      - "改稿纯文本（段落结构与原稿一致）"
      - "glossary.json（terms 数组：term/canonical/variants/decision_basis）"
      - "changes.json（changes 数组：original/revised/type/reason/location）"
    outputs:
      - "/app/work/sentences.json"
      - "/app/work/terms_report.json"
      - "/app/output/edit_report.json"
      - "/app/output/edit_report.md"
    outputs_note: >
      edit_report 的 verification_hint 直接给出 semantic_preservation /
      data_units_citations / minimal_edit / traceability / register_and_errors /
      glossary 六项的计数口径，可原样写入 result.json 的 verification 与 edit_report。

  - path: resources/checklist.md
    kind: doc
    purpose: 带计数口径的自检清单，对应 verification 八项

  - path: resources/style_guide.md
    kind: doc
    purpose: 分文体语域要点 + 通用红线 + 脚本可检的语域词表

  - path: resources/gain_protocol.md
    kind: doc
    purpose: 使用增益对照协议（同原稿同术语表口径下，加载 Skill vs 不加载的记录方法）

  - path: resources/field_dict.md
    kind: doc
    purpose: 字段字典、location 格式、changes 条目规范与 type 取值、术语表规范

  - path: resources/output_example.json
    kind: sample
    purpose: 输出结构示意（占位，非任何真实稿件润色结果）

  - path: examples/README.md
    kind: doc
    purpose: 最小调用示例与从原稿到核验报告的完整步骤

runtime:
  python: ">=3.9"
  network: not_required
  notes: >
    脚本只读原稿、改稿与术语表，不改动输入。检查项按"必须改/需确认"分级：
    语义守恒与数据保真类计数应为 0；over_edit/heavy_edit 与 suspected 类只提示，
    需人工判断后再动稿，避免脚本把专业表述当成需要替换的措辞。

changelog:
  - "1.2.0: 切句支持中文句号（无空格可切）与 Fig. 3. / et al. 等缩写保护，修复整篇中文被当成一句；--out 兼容目录或文件名。"
  - "1.3.0: 切句按主语种分流——英文沿用已验证的 v1.1 句点+空白口径，中文使用标点切分；保留 --out 兼容层。"
